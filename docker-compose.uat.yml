x-backend-image: &backend_image payroll-backend:local
x-backend-build: &backend_build
  context: .
  dockerfile: Dockerfile
x-backend-env: &backend_env
  PGUSER: ${PGUSER:-postgres}
  PGPASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
  PGHOST: ${PGHOST:-postgres}
  PGPORT: ${PGPORT:-5432}
  PGDATABASE: ${PGDATABASE:-payrolldb}
  PGSSLMODE: ${PGSSLMODE:-disable}
  PGCHANNELBINDING: ${PGCHANNELBINDING:-}
  DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Bangkok}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
  APP_ENV: ${APP_ENV:-}
  GIN_MODE: ${GIN_MODE:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}

services:
  backend:
    image: *backend_image
    build: *backend_build
    container_name: payroll-backend
    environment: *backend_env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/modules >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: *backend_image
    build: *backend_build
    container_name: payroll-migrate
    environment: *backend_env
    command: [ "/app/migrate" ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  seed:
    image: *backend_image
    build: *backend_build
    container_name: payroll-seed
    environment: *backend_env
    command: [ "/app/seed" ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  frontend:
    build:
      context: ../payroll-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: payroll-frontend
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:17
    container_name: payroll-postgres
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_DB: ${PGDATABASE:-payrolldb}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    volumes:
      - payroll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  payroll_postgres_data:
    name: payroll_postgres_data