name: CI

# Deploy is manual and has no gate in front of it, so this is the only automated check the backend has.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Layering — nothing below main may reach for the database global
        run: |
          if grep -rln '"payroll-backend/config"' handlers/ middleware/ repository/ routes/ service/; then
            echo "::error::the files above import config; only main.go, wire.go, migrate/ and seed/ may name config.DB"
            exit 1
          fi
          if grep -rln 'gin-gonic' repository/; then
            echo "::error::repository/ must not know about HTTP"
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -w these files:"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
