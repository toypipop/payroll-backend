x-backend-image: &backend_image payroll-backend:local
x-backend-build: &backend_build
  context: .
  dockerfile: Dockerfile
x-backend-env: &backend_env
  PGUSER: ${PGUSER}
  PGPASSWORD: ${PGPASSWORD}
  PGHOST: postgres
  PGPORT: ${PGPORT}
  PGDATABASE: ${PGDATABASE}
  PGSSLMODE: ${PGSSLMODE}
  PGCHANNELBINDING: ${PGCHANNELBINDING}
  DB_TIMEZONE: ${DB_TIMEZONE}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-20}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
  DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}
  JWT_SECRET: ${JWT_SECRET}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  APP_ENV: ${APP_ENV}
  GIN_MODE: ${GIN_MODE}
  COOKIE_SECURE: ${COOKIE_SECURE}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}

x-container-security: &container_security
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  backend:
    <<: *container_security
    image: *backend_image
    build: *backend_build
    container_name: payroll-backend-local
    environment: *backend_env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/modules >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *container_security
    image: *backend_image
    build: *backend_build
    container_name: payroll-migrate-local
    environment: *backend_env
    command: [ "/app/migrate" ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  seed:
    <<: *container_security
    image: *backend_image
    build: *backend_build
    container_name: payroll-seed-local
    environment: *backend_env
    command: [ "/app/seed", "--mock", "--reset" ]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  frontend:
    <<: *container_security
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    build:
      context: ../payroll-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: payroll-frontend-local
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  postgres:
    <<: *container_security
    # Retain only capabilities needed by the official root initialization entrypoint.
    # The database server runs as postgres after ownership setup.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,mode=3777
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    image: payroll-postgres:17-patched
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: payroll-postgres-local
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - payroll_postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  payroll_postgres_data_local:
    name: payroll_postgres_data_local
