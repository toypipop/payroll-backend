services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-backend
    environment:
      DB_USER: postgres
      DB_PASSWORD: "1234"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: payrolldb
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Bangkok
      JWT_SECRET: payroll-super-secret-key-2024
      FRONTEND_ORIGIN: http://localhost:5174
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/v1/modules >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../payroll-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: payroll-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17
    container_name: payroll-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: payrolldb
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - payroll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  payroll_postgres_data:
    name: payroll_postgres_data
